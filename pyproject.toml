[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zap-it"
version = "0.1.0"
description = "ZAP-IT: YAML-driven zero-shot segmentation/classification pipeline (SAM2 + CLIP + BLIP-3)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Janez Pers" }]
keywords = ["segmentation", "sam2", "clip", "zero-shot", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# The heavy GPU stack (torch/torchvision, SAM-2, detectron2, transformers,
# open-clip-torch, opencv) is intentionally NOT declared here; it is provided by
# the operator-managed pip environment documented in INSTALL.md and the GPU
# lock. This keeps CPU/dev installs free of model downloads.
dependencies = [
    "numpy>=1.26.4,<3",
    "pillow>=10.4,<13",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "build==1.2.2.post1",
    "coverage[toml]==7.15.4",
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.16.4",
    "twine==7.0.0",
]
# HTTP service contract (objective 002): FastAPI/Pydantic/Uvicorn transport.
# CPU-only installs stay light; heavy model/GPU stacks remain operator-managed.
service = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "prometheus-client>=0.21,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
zap-it-service = "src.runtime.live_service:main"

[project.urls]
Repository = "https://github.com/ulfe-lmi/slaif-zap-it"
Documentation = "https://github.com/ulfe-lmi/slaif-zap-it/blob/main/README.md"
Issues = "https://github.com/ulfe-lmi/slaif-zap-it/issues"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE"]
packages = [
    "src",
    "src.core",
    "src.service",
    "src.runtime",
    "modules",
    "modules.classifier",
    "modules.geometry",
    "modules.input",
    "modules.output",
    "modules.segmenter",
    "modules.verifier",
]

[tool.setuptools.data-files]
"share/zap-it" = [
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "CHANGELOG.md",
    "RELEASE_NOTES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: opt-in serialized physical-GPU1 integration checks (never public CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["demos", "assets", "oap"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # modules.input.images patches PIL and imports optional heavy deps lazily;
    # several legacy entry scripts import after top-level statements by design.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Test stubs intentionally shadow real library APIs with short names.
"tests/conftest.py" = ["E741"]

[tool.coverage.run]
source = ["src", "modules"]
branch = true

[tool.coverage.report]
# Ratchet policy (objective 000-a): measured 67% on CPython 3.12 with branch
# coverage; gate set 3 points lower to absorb variance across the 3.10-3.12
# matrix. Raise this only when coverage measurably improves.
fail_under = 64
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
