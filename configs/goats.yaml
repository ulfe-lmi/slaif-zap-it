###############################################################################
# BLIP3 FILTER (OPTIONAL)
#
# Zero-shot verification workflow:
#   1.  For every mask patch, build a bounding box. If the original box is
#       smaller than 128 × 128 px, expand it so the patch sits centered inside
#       a 128 × 128 box.
#   2.  Crop that area and send it to BLIP-3 along with a yes-/no question.
#   3.  BLIP-3’s textual answer is parsed:
#          • if it CONTAINS the string in `trueresult`, verification passes ✔
#          • if it CONTAINS the string in `falseresult`, verification fails ✖
#
# YAML structure
# --------------
# blip3:                        ← top-level key
#   goat:                       ← label name (dict key)
#     question:    "…?"         ← yes-/no question posed to BLIP-3
#     trueresult:  "Yes"        ← substring interpreted as *true*
#     falseresult: "No"         ← substring interpreted as *false*
#     newcategory: "goat"	not relevant here
#     debug:       true         ← save cropped images and answers if true
#
#   sign:
#     question:    "…?"
#     trueresult:  "Yes"
#     falseresult: "No"
#     newcategory: "sign"	not relevant here
#     debug:       true
#
#   sign:
#     question:    "Is it an animal in the image, yes or no!"
#     trueresult:  "Yes"
#     falseresult: "No"
#     newcategory: "goat"	not relevant here
#     debug:       true
#
# The labels (keys) can contain special key/label which starts with "any," and
# is followed by a number! These trigger special processing for patches that
# have been classified, regardless of CLIP label - if the score from CLIP is
# lower than the number (e.g. "any,0.1" means any patch that has been classified
# in the upper example either as goat or as sign, but has score of 0.1 or less
# qualifies for the potential reclassification with BLIP3. If BLIP3 provides 
# trueresult ("Yes" here in the above example) then the image is re-classified
# to the category specified by newcategory!
#
# Notes
# -----
# • Add more labels simply by inserting new keys under `blip3`.
# • Patches that fail verification are automatically re-labeled as "negative".
###############################################################################


blip3:
  model_name: Salesforce/xgen-mm-phi3-mini-instruct-r-v1
  dtype: bfloat16
  use_fast_tokenizer: true
  use_fast_processor: true

  goat:
    question: "Is there an animal in the image? Yes or no!"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: goat
    debug: false

  any,0.2:
    question: "Is there an animal in the image? Yes or no!"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: goat
    debug: false



################################################################################
# VISUALIZATION
#
# "labels": e.g. "goat,sign"
#   The final set of clip_labels we actually want to keep. If a mask's best
#   label isn't in this list, we discard it. 
#
# "alpha": how transparent the color overlay is when rendering "annotated" images.
#   0 => fully transparent, 1 => fully opaque.
#
# "composite-sam2": if true, build a "pre" 2x2 summary image from all SAM2 masks
# "composite-clip": if true, build a "post" 2x2 summary image from final kept masks
# "final": if true, also build a detectron2-based "panoptic" overlay -final.jpg
################################################################################
visualization:
  labels: ["goat"]
  alpha: 0.75
  sam2:
    - id: sam2-goat-alpha
      renderer: alpha-overlay
      alpha: 0.75
  clip:
    - id: clip-goat-alpha
      renderer: alpha-overlay
      alpha: 0.75
  blip3:
    - id: blip3-panoptic
      renderer: panoptic

images:
  sam2-goat-alpha: goats-sam2
  clip-goat-alpha: goats-clip
  blip3-panoptic: goats-blip3


# Export yolo detections into dataset
# labels could be "goat,sign" etc
# trainsplit is given as percentage of the images that are to be in the train part, e.g. 80 = 80% means
# 80% of all images will be placed in the train folder and 20 test folder
# sample_roi: whether images are sampled only inside defined ROI (usually that makes a lot of sense)
export_yolo_det:
  labels: "goat"
  trainsplit: 80
  sample_roi: true
