# Service-safe tomato example. Ripeness is a request-authored BLIP3 mapping.
preprocessing:
  roi: false
  resize: 1.0
  debug: false
mask_generator:
  profile: fast
  debug: false
postsam2processing:
  min_area: null
  max_area: 160000
  min_width: null
  max_width: 400
  min_height: null
  max_height: 400
  min_aspect_ratio: null
  max_aspect_ratio: null
  allow_border_touching: true
  debug: false
candidate_views:
  clip:
    mode: raw_bbox_crop
    context_fraction: 0.10
    min_context_pixels: 0
    max_context_pixels: 64
  blip3:
    mode: single_dilated_blur
    context_fraction: 0.20
    min_context_pixels: 0
    max_context_pixels: 64
    crop_extent_multiplier: 2.0
    blur_sigma_fraction: 0.15
    contour_enabled: true
    contour_fraction: 0.02
    contour_min_pixels: 1
    contour_max_pixels: 3
    contour_rgb: [255, 224, 0]
clip:
  debug: false
  labels:
    tomato_candidate: "a tomato fruit on a tomato plant"
    foliage: "tomato plant foliage, leaves, or stems"
    background: "greenhouse structure or unrelated background"
clip_routing:
  route_to_blip3:
    labels: [tomato_candidate, foliage]
    top_k: 3
    score_margin_from_best: 0.05
    minimum_target_score: null
    uncertain_labels: [background]
    max_candidates: null
blip3:
  tomato_candidate:
    question: "Is the selected candidate a tomato fruit?"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: tomato
    falsecategory: negative
    debug: false
  foliage:
    question: "Is the selected candidate tomato plant foliage?"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: tomato_leaf
    falsecategory: negative
    debug: false
visualization:
  labels: [tomato, tomato_leaf]
  alpha: 0.70
  blip3:
    - id: tomato-final
      renderer: alpha-overlay
      alpha: 0.70
