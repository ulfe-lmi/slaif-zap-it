preprocessing:
  # Process the entire image at native resolution
  roi: false
  resize: 1.0
  debug: false

mask_generator:
  # SAM2 grid resolution and quality thresholds
  points_per_side: 64
  pred_iou_thresh: 0.70
  stability_score_thresh: 0.70
  min_mask_region_area: 100
  # multiscale crops to capture small details
  crop_n_layers: 2
  crop_n_points_downscale_factor: 2
  crop_overlap_ratio: 0.4
  # NMS and multimask toggles
  box_nms_thresh: 0.3
  multimask_output: true
  debug: false

postsam2processing:
  # Filter out any masks that are improbably large
  maxsize: 160000
  max_w: 400
  max_h: 400
  debug: false

tiled:
  # (Not used when resize is set—but provided for reference)
  tile_size: 1024
  overlap: 0.2

