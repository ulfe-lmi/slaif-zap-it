# Service-safe glass-wool example. CLIP routes broadly; BLIP3 owns the exact decision.
preprocessing:
  roi: "0,1500,4000,1500"
  resize: 1.0
  debug: false
mask_generator:
  profile: fast
  debug: false
postsam2processing:
  min_area: null
  max_area: 3000000
  min_width: null
  max_width: 4000
  min_height: null
  max_height: 800
  min_aspect_ratio: null
  max_aspect_ratio: null
  allow_border_touching: true
  debug: false
candidate_views:
  clip:
    mode: raw_bbox_crop
    context_fraction: 0.10
    min_context_pixels: 0
    max_context_pixels: 64
  blip3:
    mode: single_dilated_blur
    context_fraction: 0.20
    min_context_pixels: 0
    max_context_pixels: 64
    crop_extent_multiplier: 2.0
    blur_sigma_fraction: 0.15
    contour_enabled: true
    contour_fraction: 0.02
    contour_min_pixels: 1
    contour_max_pixels: 3
    contour_rgb: [255, 224, 0]
clip:
  debug: false
  labels:
    target_candidate: "a glass wool or mineral wool insulation surface"
    background: "a background surface, cloth, label, or unrelated scene"
clip_routing:
  route_to_blip3:
    labels: [target_candidate]
    top_k: 2
    score_margin_from_best: 0.03
    minimum_target_score: null
    uncertain_labels: []
    max_candidates: null
blip3:
  target_candidate:
    question: "Is the selected candidate a glass wool or mineral wool insulation surface?"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: wool_surface
    falsecategory: negative
    debug: false
visualization:
  labels: [wool_surface]
  alpha: 0.75
  blip3:
    - id: glasswool-final
      renderer: alpha-overlay
      alpha: 0.75
