################################################################################
# PREPROCESSING
#
# This section controls how we select which portion of the image to process
# and whether or not we rescale that portion (instead of using tiling).
#
# "roi": "x,y,w,h"
#   - The rectangular subregion of the image to process. If set to "False",
#     the entire image is used (no sub-crop).
#   - Example: "5,1825,5348,1092" means: from (x=5, y=1825), width=5348, height=1092.
#
# "resize": factor
#   - If given a numeric factor < 1.0, we downscale that ROI and do a single-pass
#     SAM2 segmentation on the resized region.
#   - If = 1.0, we do single-pass SAM2 at the native scale (no tiling).
#   - If omitted altogether, we switch to tiling mode.
#
# "debug": true/false
#   - If true, the script will save a debug image of the ROI region for
#     reference, named with a "-roiXX.jpg" suffix.
################################################################################
preprocessing:
  roi: "0,1500,4000,1500"  # Use lower quarter of a 4000x3000px image. Adjust if different!
  resize: 1.0             # 1.0 => single-pass at native scale
  debug: true             # Saves ROI debug image

################################################################################
# SAM2 MASK GENERATOR PARAMETERS
#
# These parameters control how SAM2 automatically generates masks:
#
# points_per_side:
#   The grid resolution used by SAM2. Larger => more thorough detection but
#   more GPU memory/time. If set to None/0, a different mode is used.
#
# pred_iou_thresh:
#   Discard masks with lower predicted IoU than this threshold.
#   Lower => keep more masks, higher => keep fewer but presumably better.
#
# stability_score_thresh:
#   Discard masks with a lower stability score. Lower => keep more, higher => keep fewer.
#
# min_mask_region_area:
#   Ignores extremely small masks below this pixel area.
#
# crop_n_layers:
#   How many internal cropping scales SAM2 uses. >1 => multi-scale. More thorough but slower.
#
# crop_n_points_downscale_factor:
#   For multi-scale crops, how the sampling grid changes for each scale.
#   E.g. factor=2 => at each successive crop scale, the sampling is halved.
#
# crop_overlap_ratio:
#   Overlap fraction between multi-scale crops. E.g. 0.4 => 40% overlap.
#
# box_nms_thresh:
#   Non-maximum suppression threshold (IoU) for bounding boxes among all candidate masks.
#   Lower => more aggressive merging, higher => less merging.
#
# multimask_output:
#   If true, returns multiple mask candidates per grid point if relevant.
#   Tends to produce more results but more duplicates.
#
# debug:
#   If true, it will save each raw mask patch after SAM2 is done, to help debug
#   the segmentation results before any CLIP classification.
################################################################################
mask_generator:
  points_per_side: 64
  pred_iou_thresh: 0.70
  stability_score_thresh: 0.70
  min_mask_region_area: 5000
  crop_n_layers: 2
  crop_n_points_downscale_factor: 2
  crop_overlap_ratio: 0.4
  box_nms_thresh: 0.3
  multimask_output: true
  debug: true

################################################################################
# POST-SAM2 PROCESSING
#
# After SAM2 has produced masks, we can filter them further by:
#   maxsize:  discard masks whose area > maxsize in pixels
#   max_w:    discard masks whose bounding box width > max_w
#   max_h:    discard masks whose bounding box height > max_h
#   debug:    if true, saves each final mask patch after these filters as well
################################################################################
postsam2processing:
  maxsize: 3000000
  max_w: 4000
  max_h: 800
  debug: true

################################################################################
# TILING PARAMETERS
#
# If we do not specify "resize" in preprocessing (or if "resize" is None),
# we switch to a tiling approach. For example:
#   tile_size: 1024 => each tile is 1024×1024
#   overlap: 0.2    => each tile overlaps the next by 20%
# Tiling is useful if the image or ROI is large and we don't have enough
# GPU memory to handle it in a single pass at native resolution.
################################################################################
tiled:
  tile_size: 1024
  overlap: 0.2

################################################################################
# CLIP FILTER (OPTIONAL)
#
# This is a zero-shot classification approach: each mask patch is passed to CLIP,
# which chooses the best prompt from user-defined sets. If that best label is in
# the "positive" set, we keep it; else we discard it.
#
# "padding": number of pixels to expand the bounding box around each mask so
#            CLIP sees some context.
#
# Then we have lines like 'label "goat": "prompt1, prompt2"' which define all
# the prompts for that label. If no label "..." lines are present, we skip CLIP entirely.
#
# debug: if true, saves each mask patch as a separate .jpg with best prompt in the name
################################################################################
clip:
  padding: 20
  label "wool_surface": "the front surface of a block of glass wool, the vertical face of a mineral wool slab, the main visible surface of a glass wool block, the textured front of a rock wool substrate, the fibrous face of a stone wool cube, a brownish wool surface facing the camera, the cut edge of a glass wool mat, a fuzzy glass wool panel front, a coarse wool fiber surface, the frontal side of horticultural rockwool, the rough face of a mineral insulation block, the exposed front surface of rock wool, the large flat face of a wool substrate block, a rectangular glass wool pad front, the uneven fibrous side of mineral wool, a glass wool cube front, a horticultural wool slab face, the planar side of a wool growing medium, the wide surface of glass wool, the outer face of a rock wool block, the main block surface of stone wool, the open fibrous texture of glass wool, the brown mineral wool surface, the exposed large surface of wool insulation, the wool substrate vertical face, the glass wool block frontal area, the brown fuzzy surface of glass wool, the rock wool pad facing outward, the large cut edge of mineral wool, the rough-textured surface of rock wool, the flat cut front of glass wool, the visible block face of wool, the horticulture wool cube surface, the flat wool surface on block, the brown face of a wool slab, the exposed surface of a wool block, the rough brownish surface of rock wool, the main rectangular wool face, the large brown area of mineral wool, the frontal cut of glass wool, the cut surface of stone wool, the coarse front face of wool substrate, the visible fuzzy wool face, the rough brown wool block front, the primary face of a wool block, the fiber-rich front of glass wool, the exposed main face of rockwool, the largest side of the wool slab, the face of the horticultural wool cube, the brown open surface of a glass wool block"
  label "negative": "the dark blue background, the cloth under the wool, the label on the wool, any text label, a shadow, a bright light reflection, fabric, the background, the plastic label, paper label, a blue background, a dark cloth backdrop, a shadow, the floor under the block, any label, the white label, the background fabric folds, the blue textile"
  debug: true

################################################################################
# GEOMETRY
#
# This (optional) section controls line and intersection detection on each final
# (kept) mask via Canny edge detection + Hough transform. Even if visualization
# is disabled, these geometry computations will still produce two TSV files per
# mask: "<basename>_mask{i}_lines.tsv" and "<basename>_mask{i}_intersections.tsv".
#
# debug:
#   If true, prints additional debug messages about lines and intersections found.
#
# canny_threshold1, canny_threshold2:
#   Thresholds for the Canny edge detector. Lower-> more edges, higher-> fewer edges.
#
# canny_aperture:
#   Aperture size for the Sobel operator in the Canny detector. Typically 3,5, or 7.
#
# hough_rho:
#   Distance resolution of the accumulator in pixels for Hough lines.
#   E.g., 1.0 => each grid cell in the accumulator is 1 pixel in rho space.
#
# hough_theta:
#   Angular resolution (in degrees) of the accumulator for Hough lines.
#   E.g., 1 => one degree increments. This is converted internally to radians.
#
# hough_threshold:
#   Minimum number of "votes" needed in Hough space to accept a line. Higher => fewer lines.
################################################################################
geometry:
  debug: true
  canny_threshold1: 50
  canny_threshold2: 150
  hough_threshold: 30
  hough_min_line_length: 40
  hough_max_line_gap: 100


################################################################################
# VISUALIZATION
#
# "labels": e.g. "goat,sign"
#   The final set of clip_labels we actually want to keep. If a mask's best
#   label isn't in this list, we discard it. 
#
# "alpha": how transparent the color overlay is when rendering "annotated" images.
#   0 => fully transparent, 1 => fully opaque.
#
# "composite-sam2": if true, build a "pre" 2x2 summary image from all SAM2 masks
# "composite-clip": if true, build a "post" 2x2 summary image from final kept masks
# "final": if true, also build a detectron2-based "panoptic" overlay -final.jpg
################################################################################
visualization:
  labels: "wool_surface"
  alpha: 0.75
  composite-sam2: true
  composite-clip: true
  final: true
