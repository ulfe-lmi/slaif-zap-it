# Service-safe ice-cream example; semantic subtype decisions belong to BLIP3.
preprocessing:
  roi: false
  resize: 1.0
  debug: false
mask_generator:
  profile: fast
  debug: false
postsam2processing:
  min_area: null
  max_area: 500000
  min_width: null
  max_width: 400
  min_height: null
  max_height: 400
  min_aspect_ratio: null
  max_aspect_ratio: null
  allow_border_touching: true
  debug: false
candidate_views:
  clip:
    mode: raw_bbox_crop
    context_fraction: 0.10
    min_context_pixels: 0
    max_context_pixels: 64
  blip3:
    mode: single_dilated_blur
    context_fraction: 0.20
    min_context_pixels: 0
    max_context_pixels: 64
    crop_extent_multiplier: 2.0
    blur_sigma_fraction: 0.15
    contour_enabled: true
    contour_fraction: 0.02
    contour_min_pixels: 1
    contour_max_pixels: 3
    contour_rgb: [255, 224, 0]
clip:
  debug: false
  labels:
    ice_lolly: "an ice cream lolly or frozen dessert"
    ice_lolly_stick: "a wooden popsicle or ice lolly stick"
    background: "a machine, tray, floor, shadow, or unrelated background"
clip_routing:
  route_to_blip3:
    labels: [ice_lolly, ice_lolly_stick]
    top_k: 3
    score_margin_from_best: 0.05
    minimum_target_score: null
    uncertain_labels: [background]
    max_candidates: null
blip3:
  ice_lolly:
    question: "Is the selected candidate an ice cream lolly or frozen dessert?"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: ice_lolly
    falsecategory: negative
    debug: false
  ice_lolly_stick:
    question: "Is the selected candidate a wooden popsicle or ice lolly stick?"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: ice_lolly_stick
    falsecategory: negative
    debug: false
visualization:
  labels: [ice_lolly, ice_lolly_stick]
  alpha: 0.75
  blip3:
    - id: icecream-final
      renderer: alpha-overlay
      alpha: 0.75
