# Service-safe soccer example. Broad CLIP concepts preserve recall.
preprocessing:
  roi: false
  resize: 1.0
  debug: false
mask_generator:
  profile: fast
  debug: false
postsam2processing:
  min_area: null
  max_area: 35000
  min_width: null
  max_width: 140
  min_height: null
  max_height: 220
  min_aspect_ratio: null
  max_aspect_ratio: null
  allow_border_touching: true
  debug: false
candidate_views:
  clip:
    mode: raw_bbox_crop
    context_fraction: 0.10
    min_context_pixels: 0
    max_context_pixels: 64
  blip3:
    mode: single_dilated_blur
    context_fraction: 0.20
    min_context_pixels: 0
    max_context_pixels: 64
    crop_extent_multiplier: 2.0
    blur_sigma_fraction: 0.15
    contour_enabled: true
    contour_fraction: 0.02
    contour_min_pixels: 1
    contour_max_pixels: 3
    contour_rgb: [255, 224, 0]
clip:
  debug: false
  labels:
    soccer_player: "a soccer player or football athlete on a pitch"
    soccer_ball: "a soccer ball or football on a pitch"
    background: "grass, field markings, stadium, or unrelated background"
clip_routing:
  route_to_blip3:
    labels: [soccer_player, soccer_ball]
    top_k: 3
    score_margin_from_best: 0.05
    minimum_target_score: null
    uncertain_labels: [background]
    max_candidates: null
blip3:
  soccer_player:
    question: "Is there a soccer player (human athlete) in this crop? Yes or no!"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: soccer_player
    falsecategory: negative
    debug: false
  soccer_ball:
    question: "Is there a soccer ball in the image? Yes or no!"
    trueresult: "Yes"
    falseresult: "No"
    newcategory: soccer_ball
    falsecategory: negative
    debug: false
visualization:
  labels: [soccer_player, soccer_ball]
  alpha: 0.75
  blip3:
    - id: soccer-final
      renderer: alpha-overlay
      alpha: 0.75
