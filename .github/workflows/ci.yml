name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: static (format, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: python -m pip install -e '.[dev,service]'
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Build wheel
        run: python -m build --wheel

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: python -m pip install -e '.[dev,service]'
      - name: Run CPU test suite with coverage gate
        run: pytest -q --cov=src --cov=modules --cov-report=term-missing

  release:
    name: release (artifact audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and inspect candidate artifacts
        run: |
          python -m pip install -e '.[dev,service]'
          rm -rf dist
          python -m build --wheel --sdist
          python scripts/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
          python scripts/scan_release_artifacts.py dist/*.whl dist/*.tar.gz --baseline .secrets.baseline
          python -m twine check dist/*
      - name: Scan tracked tree and artifacts for secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets scan --all-files --exclude-files '(^|/)(dist|build|\.git)/' --exclude-files '(^|/)\.secrets\.baseline$' > /tmp/detect-secrets-current.json
          python -m json.tool /tmp/detect-secrets-current.json >/dev/null
