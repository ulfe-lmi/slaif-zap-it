name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: static (format, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: python -m pip install -e '.[dev,service]'
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Documentation integrity
        run: python scripts/check_documentation.py
      - name: Build wheel
        run: python -m build --wheel

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: python -m pip install -e '.[dev,service]'
      - name: Run CPU test suite with coverage gate
        run: pytest -q --cov=src --cov=modules --cov-report=term-missing
      - name: Build wheel for installed-artifact smoke
        run: python -m build --wheel
      - name: Install built wheel outside checkout and smoke service
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          venv="$RUNNER_TEMP/zap-it-wheel-${{ matrix.python-version }}"
          python -m venv "$venv"
          "$venv/bin/pip" install "${wheel}[service,dev]"
          cd "$RUNNER_TEMP"
          PATH="$venv/bin:$PATH" "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"

  release:
    name: release (artifact audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and inspect candidate artifacts
        run: |
          python -m pip install -e '.[dev,service]'
          rm -rf dist dist-from-sdist
          python -m build --wheel --sdist
          python scripts/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
          mkdir -p "$RUNNER_TEMP/sdist-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          python -m build --wheel --outdir dist-from-sdist "$RUNNER_TEMP/sdist-source/zap_it-0.1.0"
          python scripts/verify_release_artifacts.py dist-from-sdist/*.whl
          python scripts/verify_release_artifacts.py --compare-wheels dist/*.whl dist-from-sdist/*.whl
          python scripts/scan_release_artifacts.py dist/*.whl dist/*.tar.gz dist-from-sdist/*.whl --baseline .secrets.baseline
          python -m twine check dist/*
          python -m twine check dist-from-sdist/*
          systemd-analyze verify deploy/zap-it-local.service
      - name: Install sdist-built wheel outside checkout and smoke service
        run: |
          wheel=$(find dist-from-sdist -maxdepth 1 -name '*.whl' -print -quit)
          venv="$RUNNER_TEMP/zap-it-sdist-wheel"
          python -m venv "$venv"
          "$venv/bin/pip" install "${wheel}[service,dev]"
          cd "$RUNNER_TEMP"
          PATH="$venv/bin:$PATH" "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"
      - name: Enforce tracked-tree secret baseline
        run: python scripts/scan_release_artifacts.py --tracked-tree --baseline .secrets.baseline
